[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "property_prediction"
version = "0.0.1"
description = "Predicting material properties using machine learning."
authors = [
  { name = "Amul Prakash" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = ">=3.10.0"
dependencies = [
  "mp-api",
  "boto3",
  "psycopg2-binary",
  "sqlalchemy",
  "pandas",
  "python-dotenv",
  "loguru",
  "tqdm",
  "typer",
  "awscli",
]

[dependency-groups]
dev = [
  "ruff",
  "mkdocs",
]

[tool.ruff]
line-length = 99
src = ["property_prediction"]
include = ["pyproject.toml", "property_prediction/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["property_prediction"]
force-sort-within-sections = true

